[package]
name = "nxt-spotify-backend"
version = "1.3.0"
edition = "2024"
[dependencies]
librespot-core = { path = "../vendor/librespot-dev/core", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { path = "../vendor/librespot-dev/metadata", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { path = "../vendor/librespot-dev/playback", default-features = false, features = ["rustls-tls-webpki-roots", "alsa-backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
log = "0.4"

librespot-oauth = { path = "../vendor/librespot-dev/oauth", default-features = false, features = ["rustls-tls-webpki-roots"] }
qrcode = { version = "0.14", default-features = false }
