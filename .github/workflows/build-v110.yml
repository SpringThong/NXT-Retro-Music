name: Build NXT Retro Music v1.10
on:
  push:
    branches: [build-v1.10]
permissions:
  contents: read
jobs:
  frontend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rom: stock
            define: NXT_ROM_STOCK
            folder: stock
            settings: libmsettings.so
          - rom: nextui
            define: NXT_ROM_NEXTUI
            folder: upstream
            settings: libmsettings.so
          - rom: nxredux
            define: NXT_ROM_NXREDUX
            folder: nxredux
            settings: libnxt-nxredux-settings.so
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test bounded streaming queue and click ramps
        run: |
          mkdir -p logs
          gcc -std=gnu99 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -pthread -I upstream/src qa/v110_pcm_queue.c -o /tmp/v110-pcm
          /tmp/v110-pcm | tee logs/v110-pcm-test.txt
      - name: Build the selected ARM64 frontend
        env:
          NXT_BUILD_ROM: ${{ matrix.define }}
          NXT_JOBS: "3"
        run: |
          python3 tools/build-stock.py > logs/v110-build-${{ matrix.rom }}.txt 2>&1 || { tail -100 logs/v110-build-${{ matrix.rom }}.txt; exit 1; }
      - name: Check ARM64 loader and version
        env:
          FRONTEND_FOLDER: ${{ matrix.folder }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user > /dev/null
          nxt_sysroot="$PWD/.nxt-sdk/tg5040/compiler/aarch64-nextui-linux-gnu/libc"
          qemu-aarch64 -L "$nxt_sysroot" -E "LD_LIBRARY_PATH=$PWD/$FRONTEND_FOLDER/bin/tg5040:$PWD/upstream/bin/tg5040:$nxt_sysroot/usr/lib:$nxt_sysroot/lib" "$FRONTEND_FOLDER/bin/tg5040/musicplayer.elf" --build-info | tee logs/v110-loader-${{ matrix.rom }}.txt
      - name: Collect compiled frontend and matching relink objects
        env:
          FRONTEND_FOLDER: ${{ matrix.folder }}
          FRONTEND_ROM: ${{ matrix.rom }}
        shell: python
        run: |
          import pathlib, tarfile
          f=pathlib.Path(__import__("os").environ["FRONTEND_FOLDER"])
          rom=__import__("os").environ["FRONTEND_ROM"]
          paths=[f/"bin/tg5040/musicplayer.elf",f/"BUILD_INPUTS_v1.10.json"]
          paths += list((f/"bin/tg5040").glob("*settings*.so"))
          paths += [pathlib.Path("relink/obj") if rom=="nextui" else f/"relink/obj"]
          paths += list(pathlib.Path("logs").glob("v110-*"))
          with tarfile.open("v110-"+rom+"-compiled.tar.gz","w:gz") as z:
              for p in paths:
                  assert p.exists(),p
                  z.add(p,arcname=str(p))
      - uses: actions/upload-artifact@v4
        with:
          name: v110-${{ matrix.rom }}-compiled
          path: v110-${{ matrix.rom }}-compiled.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v110-${{ matrix.rom }}-failure
          path: logs/v110-*
          retention-days: 3
  spotify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config > /dev/null
          rustc --version
          rustup target add aarch64-unknown-linux-gnu
          mkdir -p logs
      - name: Run Spotify helper regression tests
        run: cargo test --locked --jobs 3 --manifest-path spotify/backend/Cargo.toml > logs/v110-spotify-tests.txt 2>&1 || { tail -100 logs/v110-spotify-tests.txt; exit 1; }
      - name: Build pinned-SDK ARM64 Spotify helper
        run: |
          python3 tools/sdk-assets.py > logs/v110-spotify-sdk.txt 2>&1 || { tail -80 logs/v110-spotify-sdk.txt; exit 1; }
          bash tools/build-spotify.sh > logs/v110-spotify-build.txt 2>&1 || { tail -100 logs/v110-spotify-build.txt; exit 1; }
      - name: Collect helper and regression evidence
        shell: python
        run: |
          import pathlib,tarfile
          with tarfile.open("v110-spotify-compiled.tar.gz","w:gz") as z:
              z.add("upstream/bin/tg5040/nxt-spotify-backend")
              for p in pathlib.Path("logs").glob("v110-*"):z.add(p,arcname=str(p))
      - uses: actions/upload-artifact@v4
        with:
          name: v110-spotify-compiled
          path: v110-spotify-compiled.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: v110-spotify-failure
          path: logs/v110-*
          retention-days: 3
