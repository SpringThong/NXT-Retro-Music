name: Publish NXT Retro Music v1.9.7.7
on:
  push:
    branches: [main]
    paths: ['.nxt-publish/ready']
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish verified NXT Retro Music v1.9.7.7'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Import verified source and publish original installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .nxt-publish/publish.py
