[package]
name = "nxt-soundcloud-backend"
version = "1.3.0"
edition = "2024"
license = "GPL-3.0-only"
[dependencies]
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process", "time"] }
serde_json = "=1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
qrcode = { version = "=0.14.1", default-features = false }
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "aac", "isomp4"] }
